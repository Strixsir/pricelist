<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --primary-red: #d93025;
            --text-color: #3c4043;
            --border-color: #e0e0e0;
            --blue-link: #1a73e8;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--text-color); background-color: #f8f9fa; }
        .neon-warning { background: #fff0f0; border: 2px solid var(--primary-red); color: var(--primary-red); padding: 15px; border-radius: 8px; text-align: center; font-weight: 800; text-transform: uppercase; box-shadow: 0 0 10px rgba(217, 48, 37, 0.3); margin: 15px 0; }
        .cart-container { position: sticky; top: 20px; z-index: 100; }
        #order-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); align-items: flex-start; justify-content: center; overflow-y: auto; padding: 40px 20px; box-sizing: border-box; z-index: 1000; }
        .modal-content { background: white; padding: 30px; border-radius: 8px; max-width: 550px; width: 100%; margin: auto; position: relative; }
    </style>
</head>
<body class="p-5 max-w-[1300px] mx-auto">

    <h1 class="text-center text-3xl font-bold mb-6">Product Catalog</h1>

    <div class="main-layout grid grid-cols-1 md:grid-cols-[2fr,1fr] gap-6">
        <div class="tables-section">
            <h2 class="text-xl font-bold border-b-2 border-red-600 inline-block mb-4">Raw Powders</h2>
            <div class="bg-white shadow rounded-lg overflow-x-auto mb-10">
                <table class="w-full min-w-[800px]">
                    <thead class="bg-gray-50"><tr><th class="p-4 text-left">Name</th><th class="p-4 text-left">Batch</th><th class="p-4 text-left">Lab</th><th class="p-4 text-left">Stock</th><th class="p-4 text-left">Retail (100g)</th><th class="p-4 text-left">Pre-order (1kg)</th><th></th></tr></thead>
                    <tbody id="product-list"></tbody>
                </table>
            </div>

            <h2 class="text-xl font-bold border-b-2 border-red-600 inline-block mb-4">Exclusive Add-ons</h2>
            <div class="bg-orange-50 shadow rounded-lg overflow-x-auto mb-10">
                <table class="w-full min-w-[600px]">
                    <thead><tr><th class="p-4 text-left">Name</th><th class="p-4 text-left">Batch</th><th class="p-4 text-left">Lab</th><th class="p-4 text-left">Price (10g)</th><th></th></tr></thead>
                    <tbody id="addon-list"></tbody>
                </table>
            </div>

            <h2 class="text-xl font-bold border-b-2 border-red-600 inline-block mb-4">Finished Oils</h2>
            <div class="neon-warning">⚠️ Note: Vials are 30 ML, not 10 ML.</div>
            <div class="bg-white shadow rounded-lg overflow-x-auto mb-10">
                <table class="w-full min-w-[800px]">
                    <thead><tr><th class="p-4 text-left">Name</th><th class="p-4 text-left">Batch</th><th class="p-4 text-left">Lab</th><th class="p-4 text-left">Stock</th><th class="p-4 text-left">Price (30ml)</th><th class="p-4 text-left">Price (10ml)</th><th></th></tr></thead>
                    <tbody id="oil-list"></tbody>
                </table>
            </div>
        </div>

        <div class="cart-container bg-white p-6 rounded-lg shadow border">
            <h2 class="text-xl font-bold mb-4">Your Selection</h2>
            <ul id="cart-items" class="mb-4 space-y-2"></ul>
            <button class="w-full bg-blue-600 text-white p-3 rounded font-bold" onclick="openCheckoutModal()">Place Order</button>
        </div>
    </div>

    <div id="order-modal">
        <div class="modal-content">
            <span class="absolute top-4 right-6 text-2xl cursor-pointer" onclick="closeModal()">&times;</span>
            <h3 class="text-lg font-bold mb-4">Complete Order</h3>
            <p>Send to: <strong id="vendor-email-text">strixsir@proton.me</strong></p>
            <button class="mt-2 bg-gray-200 px-3 py-1 rounded text-sm" onclick="copyEmail()">Copy Email</button>
        </div>
    </div>

    <script>
        // Fallback data prevents "fetch" errors in preview environments
        let products = [
            { name: "Test Base", batch: "B-001", labResult: "99%", stock100: 10, p100: 200, p1k: 1200, category: "raw" },
            { name: "Anavar", batch: "A-001", labResult: "98%", stock100: 5, p100: 50, category: "addon" },
            { name: "Test E", batch: "O-001", labResult: "250mg", stock100: 10, p100: 45, category: "oil" }
        ];
        let cart = [];

        function render() {
            const raw = products.filter(p => p.category === 'raw');
            const addon = products.filter(p => p.category === 'addon');
            const oil = products.filter(p => p.category === 'oil');

            document.getElementById('product-list').innerHTML = raw.map(i => `<tr><td class="p-4">${i.name}</td><td class="p-4">${i.batch}</td><td class="p-4">${i.labResult}</td><td class="p-4">${i.stock100}</td><td class="p-4">$${i.p100}</td><td class="p-4">$${i.p1k}</td><td class="p-4"><button class="text-blue-600 underline" onclick="addToCart('${i.name}', '100g')">Add</button></td></tr>`).join('');
            document.getElementById('addon-list').innerHTML = addon.map(i => `<tr><td class="p-4">${i.name}</td><td class="p-4">${i.batch}</td><td class="p-4">${i.labResult}</td><td class="p-4">$${i.p100}</td><td class="p-4"><button class="text-blue-600 underline" onclick="addToCart('${i.name}', '10g')">Add</button></td></tr>`).join('');
            document.getElementById('oil-list').innerHTML = oil.map(i => `<tr><td class="p-4">${i.name}</td><td class="p-4">${i.batch}</td><td class="p-4">${i.labResult}</td><td class="p-4">${i.stock100}</td><td class="p-4">$${i.p100}</td><td class="p-4">$${(i.p100/3).toFixed(2)}</td><td class="p-4"><button class="text-blue-600 underline" onclick="addToCart('${i.name}', '30ml')">Add</button></td></tr>`).join('');
        }

        function addToCart(name, size) {
            cart.push({ name, size });
            document.getElementById('cart-items').innerHTML = cart.map((i, idx) => `<li class="flex justify-between">${i.name} (${i.size}) <button class="text-red-500" onclick="cart.splice(${idx},1);renderCartUI()">×</button></li>`).join('');
        }

        function renderCartUI() {
            document.getElementById('cart-items').innerHTML = cart.map((i, idx) => `<li class="flex justify-between">${i.name} (${i.size}) <button class="text-red-500" onclick="cart.splice(${idx},1);renderCartUI()">×</button></li>`).join('');
        }

        function copyEmail() { navigator.clipboard.writeText("strixsir@proton.me"); }
        function openCheckoutModal() { document.getElementById('order-modal').style.display = 'flex'; }
        function closeModal() { document.getElementById('order-modal').style.display = 'none'; }
        
        render();
    </script>
</body>
</html>
